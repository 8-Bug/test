<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>鹈鹕骑自行车</title>
<style>
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    background: linear-gradient(#8fd3ff 0 68%, #d8f0a8 68% 84%, #7eae63 84% 100%);
  }

  .scene {
    position: relative;
    width: 100vw;
    height: 100vh;
    min-height: 560px;
  }

  .sun {
    position: absolute;
    right: 8vw;
    top: 7vh;
    width: 90px;
    height: 90px;
    border-radius: 50%;
    background: #ffd85a;
    box-shadow: 0 0 30px rgba(255,216,90,.65);
  }

  .cloud {
    position: absolute;
    width: 160px;
    height: 52px;
    background: rgba(255,255,255,.88);
    border-radius: 40px;
    animation: cloudMove 18s linear infinite;
  }
  .cloud::before, .cloud::after {
    content: "";
    position: absolute;
    background: inherit;
    border-radius: 50%;
  }
  .cloud::before { width: 70px; height: 70px; left: 25px; top: -32px; }
  .cloud::after  { width: 90px; height: 90px; right: 20px; top: -45px; }
  .cloud.c1 { left: -180px; top: 16vh; }
  .cloud.c2 { left: -340px; top: 28vh; transform: scale(.75); animation-delay: -8s; }

  @keyframes cloudMove {
    to { transform: translateX(calc(100vw + 520px)); }
  }

  .road {
    position: absolute;
    left: 0;
    bottom: 0;
    width: 100%;
    height: 19vh;
    min-height: 110px;
    background: #525252;
    border-top: 8px solid #d7c89c;
  }

  .road-line {
    position: absolute;
    bottom: 8vh;
    left: 0;
    width: 100%;
    height: 8px;
    background:
      repeating-linear-gradient(
        90deg,
        #f8ef95 0 90px,
        transparent 90px 145px
      );
    animation: roadMove 1.1s linear infinite;
  }

  @keyframes roadMove {
    to { background-position-x: -145px; }
  }

  .bike-wrap {
    position: absolute;
    left: 50%;
    bottom: 9vh;
    width: 560px;
    height: 420px;
    transform: translateX(-50%);
    animation: bob .7s ease-in-out infinite alternate;
  }

  @keyframes bob {
    from { transform: translateX(-50%) translateY(0); }
    to   { transform: translateX(-50%) translateY(-6px); }
  }

  .wheel {
    position: absolute;
    bottom: 0;
    width: 155px;
    height: 155px;
    border: 12px solid #202020;
    border-radius: 50%;
    background:
      radial-gradient(circle at center, #222 0 7px, transparent 8px),
      repeating-conic-gradient(from 0deg, #777 0deg 2deg, transparent 2deg 30deg);
    animation: spin .9s linear infinite;
  }
  .wheel.left { left: 48px; }
  .wheel.right { right: 48px; }

  @keyframes spin { to { transform: rotate(360deg); } }

  .frame {
    position: absolute;
    left: 120px;
    bottom: 78px;
    width: 310px;
    height: 115px;
  }

  .bar {
    position: absolute;
    height: 12px;
    background: #db3b3b;
    border-radius: 8px;
    transform-origin: left center;
    box-shadow: 0 2px 0 rgba(0,0,0,.15);
  }
  .bar.a { width: 165px; left: 30px; top: 50px; transform: rotate(-2deg); }
  .bar.b { width: 150px; left: 120px; top: 57px; transform: rotate(-52deg); }
  .bar.c { width: 155px; left: 48px; top: 85px; transform: rotate(-48deg); }
  .bar.d { width: 120px; left: 48px; top: 86px; transform: rotate(3deg); }
  .bar.e { width: 112px; left: 196px; top: 50px; transform: rotate(57deg); }

  .fork {
    position: absolute;
    width: 10px;
    height: 118px;
    background: #263238;
    right: 122px;
    bottom: 93px;
    transform: rotate(-8deg);
    border-radius: 8px;
  }

  .handle {
    position: absolute;
    width: 88px;
    height: 10px;
    background: #263238;
    right: 86px;
    bottom: 205px;
    transform: rotate(-5deg);
    border-radius: 8px;
  }

  .seat {
    position: absolute;
    left: 245px;
    bottom: 205px;
    width: 72px;
    height: 15px;
    background: #222;
    border-radius: 16px;
    transform: rotate(-4deg);
  }

  .seat-post {
    position: absolute;
    left: 275px;
    bottom: 164px;
    width: 9px;
    height: 50px;
    background: #263238;
    transform: rotate(-8deg);
  }

  .pedal {
    position: absolute;
    left: 268px;
    bottom: 95px;
    width: 24px;
    height: 24px;
    border: 7px solid #222;
    border-radius: 50%;
  }
  .pedal::after {
    content: "";
    position: absolute;
    left: 5px;
    top: 5px;
    width: 58px;
    height: 7px;
    background: #222;
    transform-origin: left center;
    animation: crank .9s linear infinite;
  }
  @keyframes crank { to { transform: rotate(360deg); } }

  .pelican {
    position: absolute;
    left: 160px;
    bottom: 178px;
    width: 260px;
    height: 220px;
  }

  .body {
    position: absolute;
    left: 70px;
    top: 72px;
    width: 135px;
    height: 118px;
    background: #f7f4ea;
    border: 4px solid #4c4c4c;
    border-radius: 55% 48% 52% 45%;
    transform: rotate(-8deg);
  }

  .wing {
    position: absolute;
    left: 86px;
    top: 98px;
    width: 100px;
    height: 68px;
    background: #d9dde0;
    border: 4px solid #4c4c4c;
    border-radius: 60% 38% 60% 45%;
    transform: rotate(8deg);
  }

  .neck {
    position: absolute;
    left: 134px;
    top: 21px;
    width: 52px;
    height: 105px;
    background: #f7f4ea;
    border: 4px solid #4c4c4c;
    border-radius: 45% 50% 25% 25%;
    transform: rotate(8deg);
  }

  .head {
    position: absolute;
    left: 125px;
    top: 0;
    width: 80px;
    height: 72px;
    background: #f7f4ea;
    border: 4px solid #4c4c4c;
    border-radius: 50%;
  }

  .eye {
    position: absolute;
    left: 174px;
    top: 21px;
    width: 10px;
    height: 10px;
    background: #111;
    border-radius: 50%;
    z-index: 3;
  }

  .beak {
    position: absolute;
    left: 185px;
    top: 34px;
    width: 108px;
    height: 25px;
    background: #f4a43a;
    border: 4px solid #4c4c4c;
    border-left: 0;
    border-radius: 0 70% 60% 0;
    transform: rotate(4deg);
    transform-origin: left center;
  }

  .pouch {
    position: absolute;
    left: 178px;
    top: 49px;
    width: 92px;
    height: 47px;
    background: #f2b25f;
    border: 4px solid #4c4c4c;
    border-top: 0;
    border-radius: 0 0 65% 65%;
    transform: rotate(6deg);
  }

  .leg {
    position: absolute;
    width: 12px;
    height: 82px;
    background: #e39138;
    border-radius: 10px;
    transform-origin: top center;
  }
  .leg.one { left: 120px; top: 162px; transform: rotate(22deg); }
  .leg.two { left: 161px; top: 158px; transform: rotate(-18deg); }

  .foot {
    position: absolute;
    width: 40px;
    height: 9px;
    background: #e39138;
    border-radius: 10px;
  }
  .foot.one { left: 125px; top: 232px; transform: rotate(15deg); }
  .foot.two { left: 142px; top: 227px; transform: rotate(-10deg); }

  .arm {
    position: absolute;
    left: 171px;
    top: 123px;
    width: 75px;
    height: 12px;
    background: #d9dde0;
    border: 3px solid #4c4c4c;
    border-radius: 12px;
    transform: rotate(-28deg);
    transform-origin: left center;
  }

  .title {
    position: absolute;
    left: 50%;
    top: 6vh;
    transform: translateX(-50%);
    padding: 12px 24px;
    border-radius: 999px;
    background: rgba(255,255,255,.78);
    backdrop-filter: blur(8px);
    color: #253443;
    font-size: clamp(24px, 4vw, 44px);
    font-weight: 800;
    letter-spacing: .05em;
    box-shadow: 0 8px 24px rgba(0,0,0,.12);
  }

  .hint {
    position: absolute;
    left: 50%;
    top: 15vh;
    transform: translateX(-50%);
    color: rgba(20,40,50,.72);
    font-size: 15px;
  }

  @media (max-width: 650px) {
    .bike-wrap { transform: translateX(-50%) scale(.72); }
    @keyframes bob {
      from { transform: translateX(-50%) scale(.72) translateY(0); }
      to   { transform: translateX(-50%) scale(.72) translateY(-6px); }
    }
  }
</style>
</head>
<body>
  <div class="scene">
    <div class="sun"></div>
    <div class="cloud c1"></div>
    <div class="cloud c2"></div>

    <div class="title">鹈鹕骑自行车 🚲</div>
    <div class="hint">纯 HTML + CSS 动画，无需图片素材</div>

    <div class="bike-wrap">
      <div class="wheel left"></div>
      <div class="wheel right"></div>

      <div class="frame">
        <div class="bar a"></div>
        <div class="bar b"></div>
        <div class="bar c"></div>
        <div class="bar d"></div>
        <div class="bar e"></div>
      </div>

      <div class="fork"></div>
      <div class="handle"></div>
      <div class="seat"></div>
      <div class="seat-post"></div>
      <div class="pedal"></div>

      <div class="pelican">
        <div class="body"></div>
        <div class="wing"></div>
        <div class="neck"></div>
        <div class="head"></div>
        <div class="eye"></div>
        <div class="beak"></div>
        <div class="pouch"></div>
        <div class="arm"></div>
        <div class="leg one"></div>
        <div class="leg two"></div>
        <div class="foot one"></div>
        <div class="foot two"></div>
      </div>
    </div>

    <div class="road">
      <div class="road-line"></div>
    </div>
  </div>
</body>
</html>
