<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>鵜鶘踩單車 · 香港主題動畫</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: linear-gradient(145deg, #1a2a3a 0%, #2d4a5e 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Segoe UI', Roboto, system-ui, sans-serif;
            padding: 1rem;
        }

        .scene {
            background: linear-gradient(180deg, #0b1a2a 0%, #1e3c50 40%, #2d5a5a 80%, #1a3a2a 100%);
            border-radius: 4rem 4rem 2rem 2rem;
            padding: 2.5rem 2rem 2rem;
            box-shadow: 
                0 30px 45px -20px rgba(0, 0, 0, 0.8),
                inset 0 -5px 0 #0a1a10,
                inset 0 5px 15px rgba(255, 255, 255, 0.1);
            position: relative;
            overflow: hidden;
            border: 4px solid #ffd96690;
            max-width: 800px;
            width: 100%;
        }

        .sun {
            position: absolute;
            top: 25px;
            right: 40px;
            width: 70px;
            height: 70px;
            background: #ffd966;
            border-radius: 50%;
            box-shadow: 0 0 0 10px #ffd96640, 0 0 30px #ffd966;
            animation: glow 3s infinite alternate;
        }

        @keyframes glow {
            from { box-shadow: 0 0 0 10px #ffd96640, 0 0 30px #ffd966; }
            to { box-shadow: 0 0 0 18px #ffd96630, 0 0 50px #ffd966; }
        }

        .cloud {
            position: absolute;
            background: #d4e4f0;
            border-radius: 100px;
            opacity: 0.25;
            filter: drop-shadow(0 5px 8px rgba(0, 0, 0, 0.2));
        }

        .cloud1 {
            width: 100px;
            height: 35px;
            top: 40px;
            left: 30px;
        }

        .cloud1::before,
        .cloud1::after {
            content: '';
            position: absolute;
            background: #d4e4f0;
            border-radius: 50%;
        }

        .cloud1::before {
            width: 45px;
            height: 45px;
            top: -20px;
            left: 10px;
        }

        .cloud1::after {
            width: 55px;
            height: 55px;
            top: -28px;
            left: 38px;
        }

        .cloud2 {
            width: 130px;
            height: 40px;
            top: 100px;
            right: 80px;
        }

        .cloud2::before,
        .cloud2::after {
            content: '';
            position: absolute;
            background: #d4e4f0;
            border-radius: 50%;
        }

        .cloud2::before {
            width: 50px;
            height: 50px;
            top: -25px;
            left: 15px;
        }

        .cloud2::after {
            width: 70px;
            height: 70px;
            top: -38px;
            left: 45px;
        }

        .ground {
            position: relative;
            margin-top: 1.5rem;
            height: 20px;
            background: #2d3e4e;
            border-radius: 100px;
            box-shadow: 0 8px 0 #1a2a3a, 0 12px 15px rgba(0, 0, 0, 0.5);
            width: 100%;
            z-index: 2;
        }

        .bike-container {
            display: flex;
            justify-content: center;
            align-items: flex-end;
            position: relative;
            z-index: 5;
            margin-bottom: -10px;
            animation: bounce 0.8s infinite alternate ease-in-out;
        }

        @keyframes bounce {
            from { transform: translateY(0); }
            to { transform: translateY(-5px); }
        }

        svg {
            width: 100%;
            max-width: 650px;
            height: auto;
            filter: drop-shadow(0 10px 10px rgba(0, 0, 0, 0.4));
            overflow: visible;
        }

        .pedal-group {
            transform-origin: 530px 340px;
            animation: pedalSpin 1.8s infinite linear;
        }

        @keyframes pedalSpin {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        .wheel-spokes {
            transform-origin: 220px 380px;
            animation: wheelSpin 1.8s infinite linear;
        }

        .wheel-spokes-back {
            transform-origin: 430px 380px;
            animation: wheelSpin 1.8s infinite linear;
        }

        @keyframes wheelSpin {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        .pelican-head {
            animation: nod 2s infinite alternate ease-in-out;
            transform-origin: 360px 150px;
        }

        @keyframes nod {
            from { transform: rotate(-1deg); }
            to { transform: rotate(4deg); }
        }

        .wing {
            animation: flap 0.9s infinite alternate ease-in-out;
            transform-origin: 350px 190px;
        }

        @keyframes flap {
            from { transform: rotate(-2deg) translateY(0); }
            to { transform: rotate(6deg) translateY(-5px); }
        }

        .pouch {
            animation: pouchWobble 1.2s infinite alternate ease-in-out;
            transform-origin: 410px 160px;
        }

        @keyframes pouchWobble {
            from { transform: rotate(-3deg); }
            to { transform: rotate(4deg); }
        }

        .scarf {
            animation: scarfMove 0.6s infinite alternate ease-in-out;
            transform-origin: 340px 150px;
        }

        @keyframes scarfMove {
            from { transform: skewX(-2deg) translateX(0); }
            to { transform: skewX(4deg) translateX(4px); }
        }

        .shadow {
            animation: shadowPulse 0.8s infinite alternate;
        }

        @keyframes shadowPulse {
            from { opacity: 0.25; transform: scaleX(1); }
            to { opacity: 0.35; transform: scaleX(1.1); }
        }

        .neon-sign {
            position: absolute;
            top: 30px;
            left: 30px;
            background: #ff0044;
            color: white;
            padding: 0.3rem 1rem;
            border-radius: 30px;
            font-weight: 700;
            font-size: 0.85rem;
            letter-spacing: 0.15em;
            text-transform: uppercase;
            box-shadow: 0 0 15px #ff0044, 0 0 30px #ff004480;
            animation: neonFlicker 1.5s infinite alternate;
            z-index: 10;
            border: 1px solid #ff88aa;
            transform: rotate(-3deg);
        }

        @keyframes neonFlicker {
            from { opacity: 0.9; box-shadow: 0 0 15px #ff0044, 0 0 30px #ff004480; }
            to { opacity: 1; box-shadow: 0 0 20px #ff0044, 0 0 45px #ff0044; }
        }

        .ferry {
            position: absolute;
            bottom: 120px;
            right: 20px;
            width: 80px;
            height: 25px;
            background: #2d8c6e;
            border-radius: 8px 8px 0 0;
            z-index: 3;
            opacity: 0.5;
            box-shadow: 0 4px 0 #1a5e4a;
        }

        .ferry::before {
            content: '';
            position: absolute;
            top: -12px;
            left: 10px;
            width: 60px;
            height: 12px;
            background: #f4a261;
            border-radius: 6px 6px 0 0;
        }

        .ferry::after {
            content: '';
            position: absolute;
            bottom: -8px;
            left: 5px;
            width: 70px;
            height: 8px;
            background: #1a5e4a;
            border-radius: 4px;
        }

        @media (max-width: 550px) {
            .scene {
                padding: 1.5rem 1rem 1rem;
                border-radius: 2.5rem 2.5rem 1.5rem 1.5rem;
            }

            .sun {
                width: 45px;
                height: 45px;
                top: 15px;
                right: 20px;
            }

            .cloud1,
            .cloud2 {
                opacity: 0.15;
                transform: scale(0.7);
            }

            .neon-sign {
                font-size: 0.65rem;
                padding: 0.2rem 0.7rem;
                top: 15px;
                left: 15px;
            }

            .ferry {
                display: none;
            }
        }
    </style>
</head>
<body>
    <div class="scene">
        <div class="sun"></div>
        <div class="cloud cloud1"></div>
        <div class="cloud cloud2"></div>
        <div class="neon-sign">香港 · HK</div>
        <div class="ferry"></div>

        <div class="bike-container">
            <svg viewBox="0 0 700 520" xmlns="http://www.w3.org/2000/svg" version="1.1">
                <ellipse class="shadow" cx="350" cy="470" rx="230" ry="18" fill="#000000" opacity="0.3" />

                <circle cx="220" cy="380" r="70" fill="none" stroke="#1a1a2e" stroke-width="10" />
                <circle cx="220" cy="380" r="62" fill="none" stroke="#ffd966" stroke-width="3" stroke-dasharray="10 8" />
                <g class="wheel-spokes">
                    <line x1="220" y1="310" x2="220" y2="450" stroke="#f0c040" stroke-width="4" />
                    <line x1="150" y1="380" x2="290" y2="380" stroke="#f0c040" stroke-width="4" />
                    <line x1="170" y1="330" x2="270" y2="430" stroke="#f0c040" stroke-width="3" />
                    <line x1="270" y1="330" x2="170" y2="430" stroke="#f0c040" stroke-width="3" />
                </g>
                <circle cx="220" cy="380" r="16" fill="#1a1a2e" />
                <circle cx="220" cy="380" r="8" fill="#ffd966" />

                <circle cx="430" cy="380" r="70" fill="none" stroke="#1a1a2e" stroke-width="10" />
                <circle cx="430" cy="380" r="62" fill="none" stroke="#ffd966" stroke-width="3" stroke-dasharray="10 8" />
                <g class="wheel-spokes-back">
                    <line x1="430" y1="310" x2="430" y2="450" stroke="#f0c040" stroke-width="4" />
                    <line x1="360" y1="380" x2="500" y2="380" stroke="#f0c040" stroke-width="4" />
                    <line x1="380" y1="330" x2="480" y2="430" stroke="#f0c040" stroke-width="3" />
                    <line x1="480" y1="330" x2="380" y2="430" stroke="#f0c040" stroke-width="3" />
                </g>
                <circle cx="430" cy="380" r="16" fill="#1a1a2e" />
                <circle cx="430" cy="380" r="8" fill="#ffd966" />

                <line x1="220" y1="380" x2="330" y2="300" stroke="#e63946" stroke-width="12" stroke-linecap="round" />
                <line x1="330" y1="300" x2="430" y2="380" stroke="#e63946" stroke-width="12" stroke-linecap="round" />
                <line x1="220" y1="380" x2="330" y2="380" stroke="#e63946" stroke-width="10" stroke-linecap="round" />
                <line x1="300" y1="280" x2="330" y2="380" stroke="#e63946" stroke-width="10" stroke-linecap="round" />
                <line x1="430" y1="380" x2="400" y2="260" stroke="#e63946" stroke-width="10" stroke-linecap="round" />
                <path d="M 380 250 L 420 245" stroke="#1d3557" stroke-width="14" stroke-linecap="round" />
                <ellipse cx="300" cy="270" rx="28" ry="12" fill="#1d3557" />
                <line x1="430" y1="380" x2="415" y2="295" stroke="#a8a8a8" stroke-width="8" stroke-linecap="round" />

                <g class="pedal-group">
                    <circle cx="530" cy="340" r="15" fill="#1a1a2e" />
                    <line x1="530" y1="340" x2="505" y2="310" stroke="#4a4a4a" stroke-width="8" stroke-linecap="round" />
                    <rect x="492" y="300" width="26" height="12" rx="6" fill="#ffd966" transform="rotate(-30, 505, 310)" />
                    <line x1="530" y1="340" x2="555" y2="370" stroke="#4a4a4a" stroke-width="8" stroke-linecap="round" />
                    <rect x="542" y="364" width="26" height="12" rx="6" fill="#ffd966" transform="rotate(30, 555, 370)" />
                </g>

                <path d="M 220 390 L 530 340" stroke="#5a5a5a" stroke-width="5" stroke-dasharray="8 6" />
                <path d="M 220 370 L 530 330" stroke="#5a5a5a" stroke-width="5" stroke-dasharray="8 6" />

                <ellipse cx="330" cy="210" rx="65" ry="50" fill="#f8f9fa" stroke="#cfd8dc" stroke-width="2" />
                <ellipse cx="330" cy="235" rx="45" ry="25" fill="#e0e7eb" />

                <path d="M 270 200 Q 230 210 220 190 Q 240 180 265 180 Z" fill="#e9ecef" stroke="#b0bec5" stroke-width="2" />

                <path d="M 310 250 Q 290 300 310 330" stroke="#9aa6b2" stroke-width="10" fill="none" stroke-linecap="round" />
                <circle cx="310" cy="335" r="10" fill="#e67e22" />

                <path d="M 350 255 Q 380 300 370 330" stroke="#7f8c8d" stroke-width="10" fill="none" stroke-linecap="round" />
                <circle cx="370" cy="335" r="12" fill="#e67e22" />

                <path d="M 370 190 Q 420 180 430 150 Q 410 160 380 170 Z" fill="#dee2e6" stroke="#adb5bd" stroke-width="2" />

                <g class="wing">
                    <path d="M 330 180 Q 300 130 260 120 Q 290 140 310 165 Z" fill="#e9ecef" stroke="#adb5bd" stroke-width="2.5" />
                </g>

                <path d="M 360 170 Q 380 130 390 110" stroke="#f8f9fa" stroke-width="45" fill="none" stroke-linecap="round" />
                <path d="M 360 170 Q 380 130 390 110" stroke="#cfd8dc" stroke-width="48" fill="none" stroke-linecap="round" opacity="0.3" />

                <g class="pelican-head">
                    <circle cx="400" cy="95" r="30" fill="#f8f9fa" stroke="#b0bec5" stroke-width="2" />
                    <path d="M 385 70 Q 395 50 410 68" stroke="#b0bec5" stroke-width="4" fill="none" stroke-linecap="round" />
                    <circle cx="412" cy="88" r="7" fill="#212529" />
                    <circle cx="415" cy="86" r="2.5" fill="white" />
                    <path d="M 420 92 L 470 85 L 465 100 L 420 105 Z" fill="#f4a261" stroke="#e76f51" stroke-width="2" />
                    <g class="pouch">
                        <path d="M 420 105 Q 440 135 465 115 L 470 100 Z" fill="#f4a261" stroke="#e76f51" stroke-width="2" />
                        <path d="M 425 108 Q 445 128 460 112" stroke="#d35400" stroke-width="2" fill="none" opacity="0.5" />
                    </g>
                    <circle cx="470" cy="92" r="3" fill="#d35400" />
                </g>

                <g class="scarf">
                    <path d="M 365 140 Q 340 145 310 130 Q 330 150 360 155 Z" fill="#e63946" opacity="0.9" />
                    <path d="M 360 152 Q 330 165 295 155" stroke="#e63946" stroke-width="8" fill="none" stroke-linecap="round" opacity="0.8" />
                </g>

                <circle cx="415" cy="85" r="2" fill="white" />

                <circle cx="398" cy="255" r="12" fill="#f8f9fa" stroke="#b0bec5" stroke-width="2" />
            </svg>
        </div>

        <div class="ground"></div>
    </div>
</body>
</html>
